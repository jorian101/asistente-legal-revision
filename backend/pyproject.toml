[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.139.2",
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyjwt>=2.14.0",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "qdrant-client>=1.18.0",
    "sse-starlette>=2.2.1",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "radon>=6.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short --capture=no --cov=src --cov-config=.coveragerc --cov-report=term-missing"
asyncio_mode = "auto"
timeout = 5
timeout_method = "thread"
markers = [
    "integration: tests with dockerized services",
]
filterwarnings = [
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/count_articles.py" = ["E501", "B007", "E402", "C401"]
"scripts/inspect_pdfs.py" = ["E501"]
"scripts/measure_outliers.py" = ["E501"]
"scripts/reindexar_obras_institucionales.py" = ["E501"]
# Migraciones Alembic autogeneradas: columnas largas
"alembic/versions/*.py" = ["E501"]
# Dependencias FastAPI: Depends() en defaults de argumentos es requerido por FastAPI
"src/adapters/http/dependencies.py" = ["B008"]
"src/routers/doctrina.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
# Baseline Fundacional: errores bloquean SOLO en modulos nuevos (auth/*).
# El resto de src/ se reporta pero NO bloquea (deuda tecnica Sprint 0: 13 errores
# en indexar_norma/repos/qdrant — ver memoria Engram topic_key
# architecture/plan-red-de-seguridad-calidad-fundamentacional).
strict_optional = true
warn_unused_configs = true
ignore_missing_imports = false
exclude = [
    "scripts/*",
    "alembic/*",
]

# Libs externas sin type stubs: no reportar import-untyped (no es deuda nuestra).
# fitz = PyMuPDF. qdrant_client = SDK de Qdrant.
[[tool.mypy.overrides]]
module = ["fitz.*", "qdrant_client.*", "bcrypt"]
ignore_missing_imports = true

# Modulos estrictos (auth, Sprint 1+): config estricta aplicada, BLOQUEAN CI.
[[tool.mypy.overrides]]
module = ["src.application.auth.*"]
strict_optional = true
disallow_untyped_defs = false
warn_unused_ignores = true

# Resto del codigo src/: config menos estricta por ahora (deuda a subir modulo
# por modulo). NO bloquea CI pero se reporta.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_untyped_defs = false
warn_return_any = false
